<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6e6e"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- Brackets -->
  <path d="M24,74 v-10 h580 v10" fill="none" stroke="#0f6e6e" stroke-width="2"/>
  <text x="314" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0f6e6e">What I built</text>
  <path d="M644,74 v-10 h136 v10" fill="none" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="712" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#7b848f">Teammates</text>

  <!-- Sources -->
  <text x="24" y="98" font-size="12" font-weight="700" fill="#5d6570" letter-spacing="0.06em">SOURCES</text>
  <g font-size="12.5" fill="#1c1f23">
    <rect x="24" y="110" width="160" height="40" rx="8" fill="#f3f5f7" stroke="#d9dde2"/>
    <text x="104" y="135" text-anchor="middle">Finnhub API</text>
    <rect x="24" y="162" width="160" height="40" rx="8" fill="#f3f5f7" stroke="#d9dde2"/>
    <text x="104" y="187" text-anchor="middle">FNSPID prices + news</text>
    <rect x="24" y="214" width="160" height="40" rx="8" fill="#f3f5f7" stroke="#d9dde2"/>
    <text x="104" y="239" text-anchor="middle">S&amp;P 500 index</text>
    <rect x="24" y="266" width="160" height="40" rx="8" fill="#f3f5f7" stroke="#d9dde2"/>
    <text x="104" y="291" text-anchor="middle">Financial Phrasebank</text>
    <rect x="24" y="318" width="160" height="40" rx="8" fill="#f3f5f7" stroke="#d9dde2"/>
    <text x="104" y="343" text-anchor="middle">FinQA</text>
  </g>

  <line x1="190" y1="234" x2="218" y2="234" stroke="#0f6e6e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ETL -->
  <text x="224" y="98" font-size="12" font-weight="700" fill="#5d6570" letter-spacing="0.06em">5-STAGE ETL</text>
  <rect x="224" y="110" width="164" height="248" rx="10" fill="#e3f1f0" stroke="#0f6e6e" stroke-width="1.5"/>
  <g font-size="12.5" fill="#1c1f23">
    <rect x="238" y="124" width="136" height="34" rx="6" fill="#ffffff"/>
    <text x="250" y="146"><tspan font-weight="700" fill="#0f6e6e">1</tspan>  Load</text>
    <rect x="238" y="170" width="136" height="34" rx="6" fill="#ffffff"/>
    <text x="250" y="192"><tspan font-weight="700" fill="#0f6e6e">2</tspan>  Clean + validate</text>
    <rect x="238" y="216" width="136" height="34" rx="6" fill="#ffffff"/>
    <text x="250" y="238"><tspan font-weight="700" fill="#0f6e6e">3</tspan>  Align in time</text>
    <rect x="238" y="262" width="136" height="34" rx="6" fill="#ffffff"/>
    <text x="250" y="284"><tspan font-weight="700" fill="#0f6e6e">4</tspan>  Features</text>
    <rect x="238" y="308" width="136" height="34" rx="6" fill="#ffffff"/>
    <text x="250" y="330"><tspan font-weight="700" fill="#0f6e6e">5</tspan>  Leakage-free split</text>
  </g>

  <line x1="392" y1="234" x2="420" y2="234" stroke="#0f6e6e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Graph -->
  <text x="424" y="98" font-size="12" font-weight="700" fill="#5d6570" letter-spacing="0.06em">NEO4J KNOWLEDGE GRAPH</text>
  <rect x="424" y="110" width="180" height="248" rx="10" fill="#e3f1f0" stroke="#0f6e6e" stroke-width="1.5"/>
  <g stroke="#0f6e6e" stroke-width="1.5" opacity="0.7">
    <line x1="514" y1="226" x2="466" y2="166"/>
    <line x1="514" y1="226" x2="562" y2="166"/>
    <line x1="514" y1="226" x2="466" y2="292"/>
    <line x1="514" y1="226" x2="562" y2="292"/>
    <line x1="514" y1="226" x2="585" y2="230" stroke-dasharray="3 3"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#1c1f23">
    <circle cx="514" cy="226" r="26" fill="#0f6e6e"/>
    <text x="514" y="230" fill="#ffffff" font-weight="700" font-size="11.5">Stock</text>
    <circle cx="466" cy="166" r="25" fill="#ffffff" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="466" y="170">Sector</text>
    <circle cx="562" cy="166" r="25" fill="#ffffff" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="562" y="170">Earnings</text>
    <circle cx="466" cy="292" r="25" fill="#ffffff" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="466" y="296">News</text>
    <circle cx="562" cy="292" r="25" fill="#ffffff" stroke="#0f6e6e" stroke-width="1.5"/>
    <text x="562" y="290">Analyst</text>
    <text x="562" y="301">recs</text>
    <circle cx="592" cy="230" r="7" fill="#ffffff" stroke="#0f6e6e" stroke-width="1.5"/>
  </g>
  <text x="514" y="342" text-anchor="middle" font-size="11.5" fill="#5d6570">60 tickers · ~7K news articles</text>

  <line x1="608" y1="234" x2="638" y2="234" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrg)"/>

  <!-- Teammates -->
  <rect x="644" y="110" width="136" height="248" rx="10" fill="#f7f8f9" stroke="#c4c9cf" stroke-dasharray="5 4"/>
  <g font-size="12.5" fill="#5d6570" text-anchor="middle">
    <rect x="658" y="150" width="108" height="56" rx="6" fill="#ffffff" stroke="#d9dde2"/>
    <text x="712" y="174">LLM analyst</text>
    <text x="712" y="191">agents</text>
    <rect x="658" y="262" width="108" height="56" rx="6" fill="#ffffff" stroke="#d9dde2"/>
    <text x="712" y="286">LLM judge +</text>
    <text x="712" y="303">evaluation</text>
    <line x1="712" y1="210" x2="712" y2="256" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#arrg)"/>
  </g>

  <text x="24" y="410" font-size="13" fill="#5d6570">~440K stock-day records in, one graph the agents query for cited context out.</text>
</svg>
